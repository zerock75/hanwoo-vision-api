services:
  matching:
    image: 192.168.0.232:5000/hanwoo-vision-api:${IMAGE_TAG:-latest}
    build: .
    gpus: all
    command: uvicorn hanwoo.services.matching.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8888:8000"
    environment:
      HANWOO_DEVICE: auto
      MATCHING_MODEL_PATH: ${MATCHING_MODEL_PATH:-/app/models/matching/best_model.pth}
      HANWOO_STORAGE_DIR: /app/storage/matching
      U2NET_HOME: /app/models/u2net
      DEFAULT_TOP_K: 5
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: hanwoo_matching_gallery
      VALIDATOR_URL: http://localhost:8501/validator
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/app/models:ro
      - ./storage:/app/storage
    depends_on:
      - qdrant

  # Superseded by dinomaly, which now serves port 8889. Start it with
  # `docker compose --profile legacy up -d anomaly` (it will claim 8889 too,
  # so stop dinomaly first).
  # anomaly:
  #   image: 192.168.0.232:5000/hanwoo-vision-api:${IMAGE_TAG:-latest}
  #   profiles: ["legacy"]
  #   build: .
  #   gpus: all
  #   command: uvicorn hanwoo.services.anomaly.main:app --host 0.0.0.0 --port 8001
  #   ports:
  #     - "8889:8001"
  #   environment:
  #     HANWOO_DEVICE: auto
  #     ANOMALY_MODEL_PATH: /app/models/anomaly/memory_bank.pth
  #     ANOMALY_THRESHOLD_PATH: /app/models/anomaly/threshold.json
  #     U2NET_HOME: /app/models/u2net
  #     HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
  #     VALIDATOR_URL: http://localhost:8501/validator
  #     NVIDIA_VISIBLE_DEVICES: all
  #     NVIDIA_DRIVER_CAPABILITIES: compute,utility
  #   volumes:
  #     - ./models:/app/models:ro
  #     - ./storage:/app/storage

  dinomaly:
    image: 192.168.0.232:5000/hanwoo-vision-api:${IMAGE_TAG:-latest}
    build: .
    gpus: all
    command: uvicorn hanwoo.services.dinomaly.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8890:8002"
      - "8889:8002"   # the retired anomaly service's port
    environment:
      HANWOO_DEVICE: auto
      # Checkpoint and threshold must move together — each backbone scores on its
      # own scale, so switching one without the other fails silently. Set both in
      # .env to override the DINOv3-large default:
      #   best_model_dinov3_large.pth -> 0.085646   AUROC 0.972, 155ms  (default)
      #   best_model_dinov3_base.pth  -> 0.136242   AUROC 0.909, 123ms
      #   best_model.pth              -> 0.192822   DINOv2, rollback
      # (AUROC/latency measured on data/2709test_latest, n=34, roi_topk.)
      DINOMALY_MODEL_PATH: ${DINOMALY_MODEL_PATH:-/app/models/dinomaly/best_model_dinov3_large.pth}
      DINOMALY_THRESHOLD: ${DINOMALY_THRESHOLD:-0.085646}
      DINOMALY_SCORE_MODE: ${DINOMALY_SCORE_MODE:-roi_topk}
      MATCHING_DOWNSCALE: ${MATCHING_DOWNSCALE:-1}
      U2NET_HOME: /app/models/u2net
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/app/models:ro

  validator:
    image: 192.168.0.232:5000/hanwoo-vision-api:${IMAGE_TAG:-latest}
    build: .
    command: >
      streamlit run src/hanwoo/services/validator/streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.baseUrlPath=validator
      --server.maxUploadSize=2048
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    environment:
      MATCHING_API_BASE_URL: http://matching:8000
      # The Anomaly tab drives POST /evaluate, which only the legacy service has.
      ANOMALY_API_BASE_URL: http://anomaly:8001
      DINOMALY_API_BASE_URL: http://dinomaly:8002
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
    # A runaway upload should take out the validator, not the host.
    mem_limit: 8g
    volumes:
      - ./storage:/app/storage
    depends_on:
      - matching
      - dinomaly

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

