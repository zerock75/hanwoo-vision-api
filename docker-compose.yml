services:
  matching:
    build: .
    command: uvicorn hanwoo.services.matching.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8888:8000"
    gpus: all
    environment:
      HANWOO_DEVICE: auto
      MATCHING_MODEL_PATH: /app/models/matching/encoder.pt
      HANWOO_STORAGE_DIR: /app/storage/matching
      U2NET_HOME: /app/models/u2net
      DEFAULT_TOP_K: 5
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: hanwoo_matching_gallery
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      HANWOO_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      
    volumes:
      - ./models:/app/models:ro
      - ./storage:/app/storage
      - ./src:/app/src
      - /mnt/f/NIPA/aidm/rmb2/save:/app/storage/rmb2/save
    depends_on:
      - qdrant

  anomaly:
    build: .
    command: uvicorn hanwoo.services.anomaly.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8889:8001"
    gpus: all
    environment:
      HANWOO_DEVICE: auto
      ANOMALY_MODEL_PATH: /app/models/anomaly/memory_bank.pth
      ANOMALY_THRESHOLD_PATH: /app/models/anomaly/threshold.json
      U2NET_HOME: /app/models/u2net
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      HANWOO_DEVICE: auto
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/app/models:ro
      - ./src:/app/src
      - ./storage:/app/storage
      - /mnt/f/NIPA/aidm/rmb2/save:/app/storage/rmb2/save
      - ./models/torch_cache:/root/.cache/torch

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      TZ: Asia/Seoul
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
    

volumes:
  qdrant_data:
